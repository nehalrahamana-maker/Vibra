name: Build Android APK

on:
  push:
    branches: [ main, build-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Kotlin Compose APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Vibra-v2.0.0.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk Vibra-v2.0.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Vibra-v2.0.0.apk
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} Vibra-v2.0.0.apk \;
          fi
          cp Vibra-v2.0.0.apk Riva-v2.0.0.apk
          ls -la *.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riva-v2.0.0-APK
          path: |
            Riva-v2.0.0.apk
            Vibra-v2.0.0.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Riva v2.0.0 — Fixed: Fullscreen Nav + Next Song Spinning"
          overwrite_files: true
          body: |
            ### 🎵 Riva v2.0.0 — YouTube Music Jetpack Compose Player
            
            **🔧 Latest Fixes (Nov 2026):**
            - ✅ Fullscreen player no longer blocks search/navigation — tap any tab while music plays
            - ✅ Next song infinite spinning FIXED — 8s watchdog auto-skips stuck tracks
            - ✅ currentIndex sync fixed — next/previous always navigate correctly
            - ✅ Stream proxy through worker — no more 403 errors on mobile networks
            - ✅ Duplicate listener bug removed — pause/play state always consistent
            
            **Features:**
            - Genuine YouTube Music backend with multi-tier streaming engine
            - 100% Full Song Playback (Zero 30s cutoffs)
            - Pure AMOLED Black UI (#000000) with Riva Red (#E50914)
            - Working Favorites & Listening History
            - Lock Screen / Notification media controls
            - Author: Kazi Nehal Rahman
            
            **Download the attached `Riva-v2.0.0.apk` and install on Android!**
          files: |
            Riva-v2.0.0.apk
            Vibra-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
