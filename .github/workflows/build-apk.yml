name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Vibra APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets in Android Assets Directory
        run: |
          mkdir -p android/app/src/main/assets/assets/covers
          cp index.html android/app/src/main/assets/
          cp style.css android/app/src/main/assets/
          cp app.js android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp -r assets/covers/* android/app/src/main/assets/assets/covers/

      - name: Generate Gradle Wrapper
        run: |
          cd android
          gradle wrapper

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Vibra-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-v1.0.0-APK
          path: Vibra-v1.0.0.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: Vibra Release v1.0.0 (Android APK)
          body: |
            ### 🎵 Vibra v1.0.0 — Next-Gen Music Player
            
            - Built with Web Audio API 6-Band Equalizer & Visualizer
            - LRCLIB Synced Lyrics Integration
            - Online YouTube Music Streaming
            - Glassmorphism & Cyberpunk Neon UI
            
            **Download the attached `Vibra-v1.0.0.apk` and install it directly on your Android phone!**
          files: Vibra-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
