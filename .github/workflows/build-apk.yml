name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Kotlin Compose APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper & Build Debug APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Vibra-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibra-v1.0.0-APK
          path: Vibra-v1.0.0.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: Vibra Release v1.0.0 (Native Jetpack Compose APK)
          body: |
            ### 🎵 Vibra v1.0.0 — Native Jetpack Compose Music App
            
            - 100% Pure Kotlin & Google Jetpack Compose
            - AndroidX Media3 / ExoPlayer Engine
            - Dark Obsidian & Cyberpunk Neon UI
            - Low-latency Audiophile Sound Reproduction
            
            **Download the attached `Vibra-v1.0.0.apk` and install it on your Android phone!**
          files: Vibra-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
