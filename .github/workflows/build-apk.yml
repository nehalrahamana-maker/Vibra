name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Kotlin Compose APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Vibra-v2.0.0.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk Vibra-v2.0.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Vibra-v2.0.0.apk
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} Vibra-v2.0.0.apk \;
          fi
          cp Vibra-v2.0.0.apk Riva-v2.0.0.apk
          ls -la *.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riva-v2.0.0-APK
          path: |
            Riva-v2.0.0.apk
            Vibra-v2.0.0.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: Riva Release v2.0.0 (Native Jetpack Compose APK)
          body: |
            ### 🎵 Riva v2.0.0 — Pure Audiophile AMOLED Music Player
            
            - **App Name: Riva** (Signature Red Branding)
            - **100% Full-Length 320kbps Audio Streams (Zero 30s snippets)**
            - **YouTube Music backend integration**
            - **Pure AMOLED Black UI (#000000)**
            - **6-Band Equalizer & Dynamics Compressor/Limiter**
            - **Author: Kazi Nehal Rahman**
            - **Build Date: October 26, 2026**
            
            **Download the attached `Riva-v2.0.0.apk` or `Vibra-v2.0.0.apk` and install it on your Android phone!**
          files: |
            Riva-v2.0.0.apk
            Vibra-v2.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
