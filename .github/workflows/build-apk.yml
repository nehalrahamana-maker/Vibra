name: Build Android APK

on:
  push:
    branches: [ main, build-apk ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Kotlin Compose APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Version comes from app/build.gradle (versionName) so the release tag,
      # artifact names and the in-app update checker always agree.
      - name: Read app version
        id: ver
        run: |
          V=$(sed -n "s/.*versionName *'\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          if [ -z "$V" ]; then V="0.0.0"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "App version: $V"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          V=${{ steps.ver.outputs.version }}
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Vibra-v$V.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk Vibra-v$V.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk Vibra-v$V.apk
          else
            find app/build/outputs/apk -name "*.apk" -exec cp {} Vibra-v$V.apk \;
          fi
          cp Vibra-v$V.apk Riva-v$V.apk
          ls -la *.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riva-v${{ steps.ver.outputs.version }}-APK
          path: |
            Riva-v${{ steps.ver.outputs.version }}.apk
            Vibra-v${{ steps.ver.outputs.version }}.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Riva v${{ steps.ver.outputs.version }} - YouTube Music Player"
          overwrite_files: true
          body: |
            ### Riva v${{ steps.ver.outputs.version }} - YouTube Music Player (APK)

            **What's new:**
            - In-app auto-update: the app checks GitHub Releases once a day and shows an "Update available" dialog when a newer version is published
            - Version, release tag and artifact names are all driven by `versionName` in app/build.gradle
            - Fullscreen nav + next-song fixes, stream proxy through worker, lock-screen controls (carried from v2.0.0)

            **Install:** download the attached `Riva-v${{ steps.ver.outputs.version }}.apk` and install it over the existing app - favorites, history and downloads are kept.

            Author: Kazi Nehal Rahman
          files: |
            Riva-v${{ steps.ver.outputs.version }}.apk
            Vibra-v${{ steps.ver.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
